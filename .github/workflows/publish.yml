name: Publish package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.21.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Pack
        run: |
          rm -rf .publish
          mkdir .publish
          pnpm pack --pack-destination .publish
          tar -tzf .publish/*.tgz
          tar -tzf .publish/*.tgz | grep -q '^package/dist/'
          if tar -tzf .publish/*.tgz | grep -q '^package/node_modules/'; then
            echo 'node_modules must not be included in the package tarball'
            exit 1
          fi

      - name: Publish
        run: npm publish .publish/*.tgz --registry=https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
